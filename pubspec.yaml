name: lisa_app
description: LISA — বাংলা ভয়েস অ্যাসিস্ট্যান্ট

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ─────────── ভয়েস ───────────
  flutter_tts: ^4.2.5          # LISA-র কথা বলা
  speech_to_text: ^7.4.0       # LISA-র শোনা

  # ─────────── ডিভাইস কন্ট্রোল ───────────
  torch_light: ^1.1.0          # টর্চ
  volume_controller: ^3.4.4    # ভলিউম
  battery_plus: ^6.2.1         # ব্যাটারি
  vibration: ^3.1.3            # কম্পন ফিডব্যাক  [(v) থাকছে]

  # ─────────── ইন্টেন্ট ───────────
  android_intent_plus: ^6.0.0  # অ্যালার্ম, সিস্টেম সেটিংস

  # ─────────── পারমিশন ও নোটিফিকেশন ───────────
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.1

  # ─────────── স্টোরেজ ───────────
  shared_preferences: ^2.3.0   # সেটিংস, হিস্টোরি

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/asset/image/           # ✅ ঠিক করা হলো (আগে ছিল lib/assets/images/)
